<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Live Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <h1>🌤️ Weather Dashboard</h1>
            <p>Check current weather and 5-day forecast</p>
        </header>


        <!-- Search Section -->
        <section class="search-section">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
            >

            <button id="searchButton">
                Search
            </button>

        </section>


        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>


        <!-- Loading -->
        <div id="loading" class="loading">
            Loading weather...
        </div>


        <!-- Current Weather -->
        <section id="currentWeather" class="current-weather">

            <div class="location">
                <h2 id="cityName">Delhi</h2>
                <p id="date"></p>
            </div>


            <div class="weather-main">

                <div class="weather-icon">
                    <img id="weatherIcon" src="" alt="Weather icon">
                </div>

                <div class="temperature">
                    <span id="temperature">--</span>°C
                </div>

            </div>


            <h3 id="weatherDescription">
                Weather condition
            </h3>


            <div class="weather-details">

                <div class="detail-box">
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>


                <div class="detail-box">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>


                <div class="detail-box">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </section>


        <!-- Forecast -->
        <section class="forecast-section">

            <h2>5-Day Forecast</h2>

            <div id="forecastContainer" class="forecast-container">

            </div>

        </section>

    </div>


    <footer>
        <p>Live Weather Dashboard | Built with HTML, CSS & JavaScript</p>
    </footer>


    <script src="script.js"></script>

</body>

</html>
